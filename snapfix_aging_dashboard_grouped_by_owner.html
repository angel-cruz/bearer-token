<!DOCTYPE html>
<html>
<head>
  <title>Snapfix Aging Dashboard</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f6f8; padding: 30px; }
    .container { max-width: 1400px; margin: auto; }
    h1 { margin-bottom: 5px; }
    .subtitle { color: #666; margin-bottom: 20px; }
    .controls, .summary, .table-card, .message {
      background: white; padding: 20px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-bottom: 20px;
    }
    button {
      background: #111827; color: white; border: none;
      padding: 12px 20px; border-radius: 8px; cursor: pointer; margin-right: 8px;
    }
    select { padding: 12px; border-radius: 8px; border: 1px solid #ccc; }
    .summary-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
    .stat { padding: 16px; border-radius: 10px; background: #f9fafb; text-align: center; }
    .stat-number { font-size: 28px; font-weight: bold; }
    .stat-label { color: #666; font-size: 13px; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #111827; color: white; padding: 12px; text-align: left; }
    td { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; vertical-align: top; }
    .badge { padding: 6px 10px; border-radius: 999px; font-size: 12px; font-weight: bold; display: inline-block; }
    .red { background: #fee2e2; color: #991b1b; }
    .amber { background: #fef3c7; color: #92400e; }
    .age-low { background: #dcfce7; color: #166534; }
    .age-mid { background: #fef3c7; color: #92400e; }
    .age-high { background: #ffedd5; color: #9a3412; }
    .age-critical { background: #fee2e2; color: #991b1b; }
    .comment { max-width: 380px; line-height: 1.4; color: #333; }
    .owner-section { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-bottom: 18px; overflow: hidden; }
    .owner-header { width: 100%; display: flex; justify-content: space-between; align-items: center; background: #111827; color: white; padding: 14px 18px; cursor: pointer; box-sizing: border-box; }
    .owner-title { font-size: 18px; font-weight: bold; }
    .owner-meta { font-size: 13px; color: #d1d5db; }
    .owner-body { padding: 0; }
    .owner-body.collapsed { display: none; }
    .owner-summary-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 14px; }
    .owner-stat { padding: 12px; border-radius: 10px; background: #f9fafb; text-align: center; border: 1px solid #eee; }
    .owner-stat-number { font-size: 22px; font-weight: bold; }
    .owner-stat-label { color: #666; font-size: 13px; }
    .sn { font-weight: bold; color: #111827; }
    </style>
</head>

<body>
<div class="container">
  <h1>Snapfix Aging Work Order Dashboard</h1>
  <div class="subtitle">Open work orders grouped by owner and age. Shared SN ranges appear under each assigned owner.</div>

  <div class="controls">
    <button onclick="loadAgingDashboard()">Load Aging Dashboard</button>
    <button onclick="loadCommentsForVisibleRows()">Load Comments for Visible Rows</button>

    <select id="ageFilter" onchange="renderTable()">
      <option value="all">All Open Work Orders</option>
      <option value="0-7">0-7 Days</option>
      <option value="8-30">8-30 Days</option>
      <option value="31-60">31-60 Days</option>
      <option value="61-90">61-90 Days</option>
      <option value="90+">90+ Days</option>
    </select>
  </div>

  <div id="summary"></div>
  <div id="results"></div>
</div>

<script>
const SNAPFIX_TOKEN = "Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJmcmVzaCI6MCwiaWF0IjoxNzg3MDc5NDU1LCJqdGkiOiJiMzA5NzlmYy03Yzk0LTQ4MDYtYTM2MS1iMWEyNWU5YTM1OTYiLCJ0eXBlIjoiYWNjZXNzIiwiaWRlbnRpdHkiOiJiNjU5Yjg5NS04ZGMxLWNkZmMtZDM3OS1hMTc3ZGJkOTJhZDYiLCJuYmYiOjE3ODcwNzk0NTUsImNzcmYiOiI1Yzc4OTI1My1jMzQ3LTRkY2ItYmI0Ni0xYWMxNmQwOGYyMzYiLCJleHAiOjE3ODcwOTAyNTUsInVzZXJfY2xhaW1zIjp7ImFkbWluX3RlbXBfcGFzc3dvcmQiOjAsInN1YiI6ImI2NTliODk1LThkYzEtY2RmYy1kMzc5LWExNzdkYmQ5MmFkNiIsImxvZ2dlZF9pbl93aXRoIjoiZW1haWwiLCJoYXNfZW1haWwiOjEsImhhc19tb2JpbGUiOjAsImVtYWlsX3ZlcmlmaWVkIjoxLCJtb2JpbGVfdmVyaWZpZWQiOjAsInZlcmlmaWNhdGlvbl9yZXF1aXJlZCI6MSwidGVtcF9wYXNzd29yZCI6MCwidGVtcF9wYXNzd29yZF9yZXF1aXJlZCI6MH19.oIj4Dl6r4DerTaIPqnr4s_6f9fUl7Ga559v30fHTaj8";

const TASKS_URL =
  "https://z4.snapfix.com/v1/app/tasks/list?businessUuid=500cd894-4cdc-4fd0-8c20-5524f668ff73&limit=500&offset=1&sortBy=lastActivity&orderBy=desc";

const COMMENT_URL =
  "https://z4.snapfix.com/v1/app/chat/list?limit=20&offset=1";

const COMMON_HEADERS = {
  "accept": "application/json, text/plain, */*",
  "authorization": SNAPFIX_TOKEN,
  "content-type": "application/json",
  "parent-uuid": "33c9bb00-81bc-4313-9fe1-c2f0a68b2e7f"
};

let agingJobs = [];

const OPEN_COLORS = [
  { value: "red", label: "New", css: "red" },
  { value: "amber", label: "In Progress", css: "amber" }
];

async function fetchJobs(color) {
  const response = await fetch(TASKS_URL, {
    method: "POST",
    headers: COMMON_HEADERS,
    body: JSON.stringify({ color, normalTasks: 1 })
  });

  if (!response.ok) {
    const errorText = await response.text();
    throw new Error(response.status + " - " + errorText);
  }

  const data = await response.json();
  return data?.data?.jobs || [];
}

async function getLatestComment(jobUuid) {
  try {
    const response = await fetch(COMMENT_URL, {
      method: "POST",
      headers: COMMON_HEADERS,
      body: JSON.stringify({
        jobUuid: jobUuid,
        chatItemTypes: []
      })
    });

    if (!response.ok) return "-";

    const data = await response.json();
    const items = data?.data?.items || [];

    const latest = items.find(item =>
      item.text &&
      item.text.trim() !== "" &&
      item.user &&
      item.user.name
    );

    if (!latest) return "-";

    const cleanText = latest.text.replace(/<[^>]*>/g, "").trim();
    return `${latest.user.name}: "${cleanText}"`;

  } catch (error) {
    console.error("Comment error:", error);
    return "-";
  }
}

function getCreatedDate(job) {
  const timestamp =
    job.createdTs ||
    job.createdAt ||
    job.created ||
    job.createdDate ||
    job.createdTime;

  if (!timestamp) return null;

  if (typeof timestamp === "number") {
    return new Date(timestamp);
  }

  return new Date(timestamp);
}

function getAgeDays(job) {
  const createdDate = getCreatedDate(job);
  if (!createdDate || isNaN(createdDate.getTime())) return null;

  const today = new Date();
  return Math.floor((today - createdDate) / (1000 * 60 * 60 * 24));
}

function getAgeBucket(days) {
  if (days === null) return "Unknown";
  if (days <= 7) return "0-7";
  if (days <= 30) return "8-30";
  if (days <= 60) return "31-60";
  if (days <= 90) return "61-90";
  return "90+";
}

function getAgeClass(days) {
  if (days === null) return "notfound";
  if (days <= 7) return "age-low";
  if (days <= 30) return "age-mid";
  if (days <= 60) return "age-high";
  return "age-critical";
}

function getSNNumber(title) {
  if (!title) return null;

  const match = title.match(/SN\s*(\d+)/i);
  return match ? parseInt(match[1], 10) : null;
}

function getOwners(sn) {
  if (!sn) return ["Unassigned"];

  const owners = [];

  // Marvin
  if ((sn >= 151 && sn <= 320) || (sn >= 772 && sn <= 842)) {
    owners.push("Marvin");
  }

  // Wilford
  if ((sn >= 1 && sn <= 150) ||
      (sn >= 701 && sn <= 771) ||
      (sn >= 901 && sn <= 968)) {
    owners.push("Wilford");
  }

  // Gerard
  if (sn >= 701 && sn <= 842) {
    owners.push("Gerard");
  }

  return owners.length ? owners : ["Unassigned"];
}

const OWNER_ORDER = ["Marvin", "Wilford", "Gerard", "Unassigned"];
let collapsedOwners = {};

function getFilteredJobs() {
  const filter = document.getElementById("ageFilter").value;

  if (filter === "all") {
    return agingJobs;
  }

  return agingJobs.filter(job => job.ageBucket === filter);
}

function groupJobsByOwner(jobs) {
  const groups = {};

  jobs.forEach(job => {
    const owners = job.owners && job.owners.length ? job.owners : ["Unassigned"];

    owners.forEach(owner => {
      if (!groups[owner]) groups[owner] = [];
      groups[owner].push(job);
    });
  });

  return groups;
}

function toggleOwner(owner) {
  collapsedOwners[owner] = !collapsedOwners[owner];
  renderTable();
}

function getVisibleJobs() {
  const filteredJobs = getFilteredJobs();
  const groups = groupJobsByOwner(filteredJobs);
  const visibleMap = new Map();

  Object.keys(groups).forEach(owner => {
    if (!collapsedOwners[owner]) {
      groups[owner].forEach(job => visibleMap.set(job.uuid, job));
    }
  });

  return Array.from(visibleMap.values());
}

async function loadAgingDashboard() {
  document.getElementById("summary").innerHTML = "";
  document.getElementById("results").innerHTML =
    `<div class="message">Loading open work orders...</div>`;

  try {
    agingJobs = [];

    for (const color of OPEN_COLORS) {
      const jobs = await fetchJobs(color.value);

      jobs.forEach(job => {
        const ageDays = getAgeDays(job);
        const sn = getSNNumber(job.title);

        agingJobs.push({
          ...job,
          sn,
          owners: getOwners(sn),
          statusLabel: color.label,
          statusCss: color.css,
          ageDays,
          ageBucket: getAgeBucket(ageDays),
          latestComment: "Not loaded"
        });
      });
    }

    agingJobs.sort((a, b) => (b.ageDays || 0) - (a.ageDays || 0));

    renderSummary();
    renderTable();

  } catch (error) {
    console.error(error);
    document.getElementById("results").innerHTML =
      `<div class="message">Error: ${error.message}</div>`;
  }
}

async function loadCommentsForVisibleRows() {
  if (agingJobs.length === 0) {
    document.getElementById("results").innerHTML =
      `<div class="message">Load the aging dashboard first.</div>`;
    return;
  }

  const visibleJobs = getVisibleJobs();

  document.getElementById("results").innerHTML =
    `<div class="message">Loading comments for ${visibleJobs.length} visible work orders...</div>`;

  for (let i = 0; i < visibleJobs.length; i++) {
    visibleJobs[i].latestComment = await getLatestComment(visibleJobs[i].uuid);

    document.getElementById("results").innerHTML =
      `<div class="message">Loading comments ${i + 1} of ${visibleJobs.length}...</div>`;
  }

  renderTable();
}

function renderSummary() {
  const counts = { "0-7": 0, "8-30": 0, "31-60": 0, "61-90": 0, "90+": 0 };

  agingJobs.forEach(job => {
    if (counts[job.ageBucket] !== undefined) counts[job.ageBucket]++;
  });

  const ownerGroups = groupJobsByOwner(agingJobs);
  const ownerCards = OWNER_ORDER
    .filter(owner => ownerGroups[owner] && ownerGroups[owner].length)
    .map(owner => `
      <div class="owner-stat">
        <div class="owner-stat-number">${ownerGroups[owner].length}</div>
        <div class="owner-stat-label">${owner}</div>
      </div>
    `).join("");

  document.getElementById("summary").innerHTML = `
    <div class="summary">
      <div class="summary-grid">
        <div class="stat"><div class="stat-number">${counts["0-7"]}</div><div class="stat-label">0-7 Days</div></div>
        <div class="stat"><div class="stat-number">${counts["8-30"]}</div><div class="stat-label">8-30 Days</div></div>
        <div class="stat"><div class="stat-number">${counts["31-60"]}</div><div class="stat-label">31-60 Days</div></div>
        <div class="stat"><div class="stat-number">${counts["61-90"]}</div><div class="stat-label">61-90 Days</div></div>
        <div class="stat"><div class="stat-number">${counts["90+"]}</div><div class="stat-label">90+ Days</div></div>
      </div>
      <div class="owner-summary-grid">${ownerCards}</div>
    </div>
  `;
}

function escapeHtml(value) {
  if (value === null || value === undefined) return "";

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function renderOwnerTable(owner, jobs) {
  let rows = "";

  jobs.forEach(job => {
    const createdDate = getCreatedDate(job);
    const createdDisplay =
      createdDate && !isNaN(createdDate.getTime())
        ? createdDate.toLocaleDateString()
        : "-";

    rows += `
      <tr>
        <td>${escapeHtml(job.reference || "-")}</td>
        <td><span class="sn">${job.sn ? "SN" + job.sn : "-"}</span></td>
        <td>${escapeHtml(job.title || "-")}</td>
        <td>${escapeHtml(job.largeTitle || "-")}</td>
        <td><span class="badge ${job.statusCss}">${job.statusLabel}</span></td>
        <td>${createdDisplay}</td>
        <td><span class="badge ${getAgeClass(job.ageDays)}">${job.ageDays !== null ? job.ageDays + " days" : "Unknown"}</span></td>
        <td class="comment">${escapeHtml(job.latestComment || "-")}</td>
      </tr>
    `;
  });

  return `
    <table>
      <thead>
        <tr>
          <th>Task #</th>
          <th>SN</th>
          <th>Location</th>
          <th>Work Order</th>
          <th>Status</th>
          <th>Created</th>
          <th>Age</th>
          <th>Latest Comment</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function renderTable() {
  const filteredJobs = getFilteredJobs();

  if (filteredJobs.length === 0) {
    document.getElementById("results").innerHTML =
      `<div class="message">No work orders found for this filter.</div>`;
    return;
  }

  const groups = groupJobsByOwner(filteredJobs);
  const owners = OWNER_ORDER.filter(owner => groups[owner] && groups[owner].length);

  let sections = "";

  owners.forEach(owner => {
    const jobs = groups[owner];
    const isCollapsed = !!collapsedOwners[owner];
    const arrow = isCollapsed ? "▶" : "▼";
    const redCount = jobs.filter(job => job.statusCss === "red").length;
    const amberCount = jobs.filter(job => job.statusCss === "amber").length;

    sections += `
      <div class="owner-section">
        <div class="owner-header" onclick="toggleOwner('${owner}')">
          <div class="owner-title">${arrow} ${owner} (${jobs.length})</div>
          <div class="owner-meta">New: ${redCount} | In Progress: ${amberCount}</div>
        </div>
        <div class="owner-body ${isCollapsed ? "collapsed" : ""}">
          ${renderOwnerTable(owner, jobs)}
        </div>
      </div>
    `;
  });

  document.getElementById("results").innerHTML = sections;
}

</script>
</body>
</html>
